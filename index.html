<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業本身審查</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <style>
    :root {
      --brand: #063f41;
      --brand-2: #0e7477;
      --brand-soft: #eaf5f4;
      --ink: #1c3033;
      --muted: #6f8a8c;
      --line: #d5e3e2;
      --bg: #f3f7f6;
      --surface: #fff;
      --core: #c97d1a;
      --core-soft: #fff4e4;
      --flag: #c0392b;
      --flag-soft: #fdecea;
      --ok: #1b7a4a;
      --warn: #b7791f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 10px 16px; background: var(--brand); color: #fff;
    }
    header h1 { font-size: 16px; font-weight: 650; margin: 0; }
    header .meta { font-size: 12px; opacity: .8; }
    header .grow { flex: 1; }
    .hdr-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .hdr-acts input[type="text"] {
      width: 140px; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: 13px;
    }
    .hdr-acts input::placeholder { color: rgba(255,255,255,.65); }
    button, .btn {
      font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer; background: #fff; color: var(--ink);
    }
    header button {
      background: transparent; color: #fff; border-color: rgba(255,255,255,.35);
    }
    header button:hover { background: rgba(255,255,255,.12); }
    header a.nav {
      font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.35); color: #fff; text-decoration: none;
    }
    header a.nav:hover { background: rgba(255,255,255,.12); }
    header button.primary { background: #fff; color: var(--brand); border-color: #fff; font-weight: 650; }
    button.primary { background: var(--brand-2); color: #fff; }
    button.danger { background: #fff; color: var(--flag); border-color: #f5c6c2; }
    button.ghost { background: #fff; border-color: var(--line); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1.25fr) minmax(320px, 0.9fr); height: calc(100% - 52px); }
    aside, .pane, .review {
      background: var(--surface); overflow: auto; min-width: 0;
    }
    aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .pane { border-right: 1px solid var(--line); }
    .side-tools { padding: 10px 12px 8px; display: grid; gap: 8px; }
    .side-tools input, .side-tools select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
    }
    .progress-line { font-size: 12px; color: var(--muted); }
    .progress-line b { color: var(--brand-2); }
    #taskList { overflow: auto; padding: 4px 8px 16px; }
    .task {
      width: 100%; text-align: left; border: 0; background: transparent;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); font: inherit;
      display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: start;
    }
    .task:hover { background: var(--brand-soft); }
    .task.active { background: var(--brand-soft); color: var(--brand-2); font-weight: 650; }
    .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: #c5d4d3; }
    .dot.started { background: var(--warn); }
    .dot.done { background: var(--ok); }
    .task .n { font-size: 11px; color: var(--muted); font-weight: 400; }
    .pane { padding: 18px 22px 72px; }
    .review { padding: 16px 18px 72px; background: #fbfdfc; }
    h2 { font-size: 20px; margin: 0 0 6px; }
    .desc { color: var(--muted); font-size: 14px; line-height: 1.65; max-width: 78ch; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
    .chip {
      font-size: 12px; padding: 3px 8px; border-radius: 999px;
      background: var(--brand-soft); color: var(--brand);
    }
    .chip.more { cursor: pointer; background: #fff; border: 1px solid var(--line); }
    .card {
      border: 1px solid var(--line); border-radius: 12px; margin: 12px 0;
      overflow: hidden; background: #fff;
    }
    .card.core { border-color: #e8c07a; background: #fffdf8; }
    .card-h {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      padding: 10px 14px; background: #f6fafa; border-bottom: 1px solid var(--line);
      font-weight: 650;
    }
    .card.core .card-h { background: var(--core-soft); }
    .badge {
      font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px;
      background: #e8eeee; color: var(--muted);
    }
    .badge.core { background: var(--core); color: #fff; }
    .badge.s, .s-pill {
      background: #ffeaa7; color: #9a5b12; border: 0; cursor: pointer;
      font: inherit; font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px;
    }
    .s-pill.miss { background: #e8eeee; color: var(--muted); cursor: default; }
    .s-pill.flagged, .badge.s.flagged { background: var(--flag-soft); color: var(--flag); }
    .s-pills { font-size: 12px; color: var(--muted); font-weight: 400; }
    .s-pills b { color: #9a5b12; }
    .line-row {
      display: flex; gap: 8px; align-items: flex-start;
    }
    .line-row .line-text { flex: 1; min-width: 0; }
    .unsuitable-box { margin-top: 10px; }
    .unsuitable-box .list-title { margin-top: 0; }
    .unsuitable-box textarea { min-height: 72px; font-size: 13px; background: #fff; }
    .card-b { padding: 12px 14px 14px; }
    .list-title { font-size: 13px; font-weight: 650; margin: 10px 0 6px; }
    ol.lines { margin: 0; padding-left: 22px; }
    ol.lines > li, .reason-block {
      margin: 0 0 6px; padding: 6px 8px; border-radius: 8px;
      border: 1px solid transparent;
    }
    ol.lines > li.scenario { cursor: default; }
    .reason-block { cursor: pointer; }
    .reason-block:hover, .line-text:hover { background: var(--brand-soft); }
    .line-text { cursor: pointer; border-radius: 6px; padding: 2px 4px; }
    ul.linked {
      list-style: none; margin: 6px 0 2px; padding: 0 0 0 4px;
      display: grid; gap: 4px;
    }
    ul.linked > li {
      display: grid; grid-template-columns: 72px 76px 88px minmax(0, 1fr) auto;
      gap: 8px; align-items: start; margin: 0; padding: 4px 6px;
      border-radius: 8px; cursor: default;
    }
    .revise-btn {
      margin-top: 1px; font: inherit; font-size: 12px; font-weight: 650;
      padding: 2px 8px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--core); background: var(--core-soft); color: #8a4e08;
    }
    .revised-from { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--muted); }
    .core-slot { min-width: 0; }
    .core-slot .badge { display: inline-block; white-space: nowrap; }
    ul.linked > li.dropped .line-text {
      text-decoration: line-through; color: var(--muted); background: var(--flag-soft);
    }
    .drop-check {
      display: flex; align-items: center; gap: 4px; margin-top: 2px;
      font-size: 12px; font-weight: 650; color: var(--muted); cursor: pointer; user-select: none;
    }
    .drop-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--flag); }
    ul.linked > li.dropped .drop-check { color: var(--flag); }
    .lane { margin-top: 2px; font-size: 12px; font-weight: 650; color: #3f5b5e; }
    .lane.eng { color: var(--brand-2); }
    .lane.ppe { color: var(--core); }
    .no-link, .unlink-reason { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    ol.lines li.flagged, .reason-block.flagged {
      background: var(--flag-soft); border-color: #f5c6c2;
    }
    .missing-row { display: flex; gap: 8px; margin-top: 8px; }
    .guide {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.55; color: #355;
    }
    .guide summary { cursor: pointer; font-weight: 650; }
    .guide ul { margin: 8px 0 0; padding-left: 18px; }
    .rev-h { font-size: 14px; font-weight: 650; margin: 0 0 8px; }
    .core-list { display: grid; gap: 6px; margin-bottom: 14px; }
    .core-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer;
    }
    .core-item input { width: 16px; height: 16px; }
    .core-item .lib { margin-left: auto; font-size: 11px; color: var(--core); }
    .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
    .hint.bad { color: var(--flag); }
    .hint.ok { color: var(--ok); }
    .note {
      background: #fff9e6; border-left: 4px solid #f1c40f;
      padding: 10px 12px; margin-bottom: 10px; border-radius: 0 8px 8px 0; font-size: 13px;
    }
    .note .q { font-style: italic; background: #fff; border: 1px solid #ebd492; padding: 6px 8px; border-radius: 6px; margin: 6px 0; }
    .note .tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
    .tag {
      font-size: 11px; padding: 1px 7px; border-radius: 999px;
      background: #fff; border: 1px solid #e0c36a; color: #7a5b12;
    }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; }
    .modal {
      position: fixed; inset: 0; background: rgba(16, 32, 34, .45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 40;
    }
    .modal.hidden { display: none; }
    .hidden { display: none !important; }
    .modal-card {
      width: min(720px, 100%); max-height: 88vh; overflow: auto;
      background: #fff; border-radius: 16px 16px 0 0; padding: 18px 18px 22px;
      box-shadow: 0 -12px 40px rgba(0,0,0,.18);
    }
    .modal-card h3 { margin: 0 0 8px; font-size: 16px; }
    .tag-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .tag-btns button {
      border: 1px solid var(--line); background: #fff;
    }
    .tag-btns button.on {
      background: var(--brand-2); color: #fff; border-color: var(--brand-2);
    }
    textarea {
      width: 100%; min-height: 110px; padding: 10px; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; font-size: 14px; resize: vertical;
    }
    #overall-comment { min-height: 140px; background: #fff; }
    .necessary-toggle {
      display: flex; align-items: flex-start; gap: 8px;
      margin: 12px 0; padding: 10px 12px;
      border: 1px solid #e8c07a; border-radius: 10px;
      background: var(--core-soft); font-size: 14px; font-weight: 650; color: #8a4e08;
    }
    .necessary-toggle.hidden { display: none; }
    .necessary-toggle input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--core); }
    .necessary-toggle small { display: block; margin-top: 2px; font-weight: 400; color: var(--muted); }
    .status { font-size: 12px; opacity: .85; }
    #gate {
      position: fixed; inset: 0; z-index: 80;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    #gate.hidden { display: none; }
    .gate-card {
      width: min(420px, 92vw); background: #fff; border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 24px;
    }
    .gate-card h2 { margin-bottom: 8px; }
    .gate-card .desc { margin: 0 0 16px; }
    .gate-card input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; font-size: 16px; margin-bottom: 12px;
    }
    .gate-card .err, .modal .err { color: var(--flag); font-size: 13px; min-height: 1.2em; margin: 8px 0 0; }
    .chip.overlap { background: #fff4e4; color: var(--core); }
    .pack-chip {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      aside { max-height: 240px; }
      .pane, .review { height: auto; }
    }
  </style>
</head>
<body>
  <div id="gate">
    <form class="gate-card" id="gate-form">
      <h2>輸入審查代號</h2>
      <p class="desc">代號只填一次，之後會留在這台電腦。題目會依代號自動分發。</p>
      <input id="gate-code" type="text" autocomplete="username" placeholder="審查代號" maxlength="40" autofocus>
      <p class="err" id="gate-err"></p>
      <button type="submit" class="primary">進入審查</button>
    </form>
  </div>
  <header>
    <div>
      <h1>作業本身審查</h1>
      <div class="meta">情境底下掛著對上的措施，勾刪掉；點句子開啟標記</div>
    </div>
    <div class="grow"></div>
    <div class="hdr-acts">
      <span class="pack-chip" id="pack-chip"></span>
      <span class="status" id="save-status"></span>
      <a class="nav" href="fat.html">Fat 原版</a>
      <a class="nav" href="full.html">專業版</a>
      <input id="annotator" type="text" class="hidden" maxlength="40" tabindex="-1">
      <button type="button" id="btn-prev">上一筆</button>
      <button type="button" id="btn-next">下一筆</button>
      <button type="button" id="btn-next-open">下一未完成</button>
      <button type="button" class="primary" id="btn-export">匯出結果</button>
      <button type="button" id="btn-progress">備份進度</button>
      <label class="status">還原進度 <input type="file" id="progress-input" accept=".json"></label>
      <label class="status hidden" id="admin-import-wrap">匯入審查結果 <input type="file" id="admin-import" accept=".json" multiple></label>
      <button type="button" id="btn-clear">清除暫存</button>
      <button type="button" id="btn-logout">登出</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <div class="side-tools">
        <div class="progress-line" id="progress-line">載入作業庫…</div>
        <input id="search" placeholder="搜尋作業名稱…">
        <select id="filter">
          <option value="all">全部作業</option>
          <option value="open">未完成</option>
          <option value="done">已完成</option>
          <option value="noted">有標問題</option>
        </select>
      </div>
      <div id="taskList"></div>
    </aside>
    <main class="pane" id="pane">
      <p class="desc">載入專家版作業後，即可開始審查。</p>
    </main>
    <section class="review" id="review"></section>
  </div>
  <div id="note-modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <h3>標記這條問題</h3>
      <div class="hint" id="note-meta"></div>
      <div class="note"><div class="q" id="note-quote"></div></div>
      <label class="necessary-toggle hidden" id="note-necessary-wrap">
        <input type="checkbox" id="note-necessary">
        <span>指定為必要設施<small>只作用在這一則情境的這條措施，其他情境的同一句不會跟著改。</small></span>
      </label>
      <div class="rev-h">標籤（可多選，至少一個）</div>
      <div class="tag-btns" id="note-tags"></div>
      <div class="rev-h">說明（必填，寫成句子）</div>
      <textarea id="note-problem" placeholder="例如：這條只禁止講手機與疲勞，沒有要求持有效操作證才可出車。現場若只核對授權名單，未受訓的人仍能開車。"></textarea>
      <div class="modal-actions">
        <button type="button" class="ghost" id="note-cancel">取消</button>
        <button type="button" class="danger hidden" id="note-delete">刪除這則</button>
        <button type="button" class="primary" id="note-save">儲存</button>
      </div>
    </div>
  </div>
  <div id="revise-modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <h3>修訂必要設施</h3>
      <div class="hint" id="revise-meta"></div>
      <div class="note"><div class="q" id="revise-original"></div></div>
      <div class="rev-h">修訂後的措施（只改這一則）</div>
      <textarea id="revise-text" placeholder="改寫這一則情境上的必要設施。其他情境的同一句不會跟著改。"></textarea>
      <p class="err" id="revise-err"></p>
      <div class="modal-actions">
        <button type="button" class="ghost" id="revise-cancel">取消</button>
        <button type="button" class="danger" id="revise-drop">刪掉這一則</button>
        <button type="button" class="primary" id="revise-save">儲存修訂</button>
      </div>
    </div>
  </div>
<script>
  const DATA_VER = "20261005g";
  let TAG_SET = ["漏提", "空泛", "不符行業", "寫反", "跨類複製", "過長", "文風改良", "不適當"];
  const TAG_HELP = {
    "漏提": "該有的情境或對策沒寫",
    "空泛": "寫了但現場做不到",
    "不符行業": "對不到本作業名稱／描述，不是不該掛在某廠",
    "寫反": "把誘發條件或禁令寫成對策，或對策與描述衝突",
    "跨類複製": "這句應屬別的危害組",
    "過長": "可刪可併的重複句",
    "文風改良": "寫得太機械、像套話，不像現場會講的話",
    "不適當": "S 評分、情境或對策不適當"
  };
  const NOTE_FIELDS = ["hazardItems", "AvoidItems", "核心理由", "severitylevel"];
  const CODE_KEY = "ra-phase1-expert-code";
  const BACKUP_MARKS = [20, 40, 60];

  let scenarioLinks = {};
  let unlinkedLinks = {};
  let library = [];
  let allTasks = [];
  let assignments = null;
  let packCode = "";
  let packMeta = null;
  let overlapIds = new Set();
  let progressDb = null;
  let lastBackupMilestone = 0;
  let completeReminded = false;
  let reviews = {};
  let currentIndex = 0;
  let annotator = "";
  let citedOpen = false;
  let draftNote = null;
  let draftRevise = null;

  const $ = (id) => document.getElementById(id);

  function normalizeCode(s) {
    return String(s || "").trim();
  }

  function packByCode(code) {
    const key = normalizeCode(code);
    const packs = (assignments && assignments.codes) || {};
    return packs[key] || null;
  }

  function overlapSetFor(code) {
    const ov = (assignments && assignments.overlap) || {};
    let keys = [];
    if (code === "A01") keys = ["A01_A02", "A01_A03"];
    else if (code === "A02") keys = ["A01_A02", "A02_A03"];
    else if (code === "A03") keys = ["A01_A03", "A02_A03"];
    const out = new Set();
    keys.forEach((k) => (ov[k] || []).forEach((id) => out.add(id)));
    return out;
  }

  function tasksForPack(meta, code) {
    if (!meta || meta.role === "admin") return allTasks.slice();
    const byId = {};
    allTasks.forEach((t) => { byId[t.taskId] = t; });
    return (meta.taskIds || []).map((id) => byId[id]).filter(Boolean);
  }

  function openDb(code) {
    return localforage.createInstance({
      driver: localforage.INDEXEDDB,
      name: "Phase1_Expert_Judge",
      storeName: "review_progress_" + code
    });
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function noteKey(note) {
    const idx = note.index === null || note.index === undefined ? "null" : String(note.index);
    const identity = note.quote ? "quote:" + note.quote : "index:" + idx;
    return JSON.stringify([note.groupName, note.field, identity]);
  }

  function resolveNoteQuote(partial) {
    if (Object.prototype.hasOwnProperty.call(partial, "quote")) return partial;
    const task = currentTask();
    const gIdx = task ? task.hazardGroups.findIndex((g) => g.groupName === partial.groupName) : -1;
    return gIdx >= 0 ? { ...partial, quote: quoteFrom(task, gIdx, partial.field, partial.index) } : partial;
  }

  function emptyReview() {
    return { coreSet: [], itemNotes: [], overallComment: "", unsuitableNotes: {}, droppedLinks: [], coreRevisions: [], necessaryMarks: [] };
  }

  function getReview(taskId) {
    if (!reviews[taskId]) reviews[taskId] = emptyReview();
    const r = reviews[taskId];
    r.coreSet = Array.isArray(r.coreSet) ? r.coreSet : [];
    r.itemNotes = Array.isArray(r.itemNotes) ? r.itemNotes : [];
    r.overallComment = typeof r.overallComment === "string" ? r.overallComment : "";
    r.unsuitableNotes = (r.unsuitableNotes && typeof r.unsuitableNotes === "object" && !Array.isArray(r.unsuitableNotes))
      ? r.unsuitableNotes
      : {};
    r.droppedLinks = Array.isArray(r.droppedLinks) ? r.droppedLinks : [];
    r.coreRevisions = Array.isArray(r.coreRevisions)
      ? r.coreRevisions.filter((item) => item && item.groupName && item.hazardItem && item.from && item.to)
      : [];
    r.necessaryMarks = Array.isArray(r.necessaryMarks)
      ? r.necessaryMarks.filter((item) => item && item.groupName && item.hazardItem && item.control && typeof item.on === "boolean")
      : [];
    return r;
  }

  function reviewErrors(task, review) {
    const names = new Set((task.hazardGroups || []).map((g) => g.groupName));
    const core = review.coreSet || [];
    const errs = [];
    if (!Array.isArray(core) || core.length < 2) {
      errs.push("核心至少勾 2 類");
    }
    for (const n of core) {
      if (!names.has(n)) errs.push(`核心不在本作業：${n}`);
    }
    for (const note of review.itemNotes || []) {
      if (!NOTE_FIELDS.includes(note.field)) {
        errs.push("欄位不合法");
      }
      const tags = note.tags || [];
      if (!tags.length) errs.push("問題標註缺標籤");
      if (tags.some((t) => !TAG_SET.includes(t))) errs.push("有不在詞表的標籤");
      if (!String(note.problem || "").trim()) errs.push("問題標註缺說明");
    }
    return [...new Set(errs)];
  }

  function isDone(task) {
    return reviewErrors(task, getReview(task.taskId)).length === 0;
  }

  function isStarted(task) {
    const r = getReview(task.taskId);
    const notes = r.unsuitableNotes || {};
    const hasUnsuitable = Object.values(notes).some((v) => String(v || "").trim());
    return (r.coreSet && r.coreSet.length > 0)
      || (r.itemNotes && r.itemNotes.length > 0)
      || (r.droppedLinks && r.droppedLinks.length > 0)
      || (r.coreRevisions && r.coreRevisions.length > 0)
      || (r.necessaryMarks && r.necessaryMarks.length > 0)
      || String(r.overallComment || "").trim().length > 0
      || hasUnsuitable;
  }

  function statusOf(task) {
    if (isDone(task)) return "done";
    if (isStarted(task)) return "started";
    return "idle";
  }

  function findNote(review, partial) {
    const key = noteKey(resolveNoteQuote(partial));
    return (review.itemNotes || []).find((n) => noteKey(n) === key) || null;
  }

  function upsertNote(taskId, note) {
    const r = getReview(taskId);
    const key = noteKey(note);
    const idx = r.itemNotes.findIndex((n) => noteKey(n) === key);
    const clean = {
      groupName: note.groupName,
      field: note.field,
      index: note.index === null || note.index === undefined ? null : Number(note.index),
      quote: note.quote || "",
      tags: [...note.tags],
      problem: String(note.problem || "").trim()
    };
    if (idx >= 0) r.itemNotes[idx] = clean;
    else r.itemNotes.push(clean);
    persist();
  }

  function deleteNote(taskId, partial) {
    const r = getReview(taskId);
    const key = noteKey(partial);
    r.itemNotes = r.itemNotes.filter((n) => noteKey(n) !== key);
    persist();
  }

  function toggleCore(taskId, groupName, on) {
    const r = getReview(taskId);
    const set = new Set(r.coreSet);
    if (on) set.add(groupName);
    else set.delete(groupName);
    r.coreSet = [...set];
    persist();
    maybeRemindBackup();
  }

  function doneCount() {
    return library.filter((t) => isDone(t)).length;
  }

  function maybeRemindBackup() {
    if (!packMeta || packMeta.role === "admin") return;
    const done = doneCount();
    for (let i = 0; i < BACKUP_MARKS.length; i += 1) {
      const mark = BACKUP_MARKS[i];
      if (done >= mark && lastBackupMilestone < mark) {
        lastBackupMilestone = mark;
        persist();
        const go = confirm(`已完成 ${done} / ${library.length} 題。請先下載備份，避免換電腦或清快取後遺失。`);
        if (go) exportProgress();
        return;
      }
    }
    if (library.length && done === library.length && !completeReminded) {
      completeReminded = true;
      persist();
      const go = confirm("本題包已全部完成。請匯出結果寄回。");
      if (go) exportResult();
    }
  }

  async function persist() {
    if (!progressDb || (packMeta && packMeta.role === "admin")) {
      if (packMeta && packMeta.role === "admin" && $("save-status")) {
        $("save-status").textContent = "高級模式不寫入勞檢員暫存";
      }
      return;
    }
    const payload = {
      schema: "ra-task-judge-phase1-expert-progress",
      dataVersion: DATA_VER,
      annotator,
      packCode,
      lastIndex: currentIndex,
      lastBackupMilestone,
      completeReminded,
      reviews,
      updatedAt: new Date().toISOString()
    };
    try {
      await progressDb.setItem("progress", payload);
      $("save-status").textContent = "已自動暫存 " + new Date().toLocaleTimeString();
    } catch (e) {
      console.error(e);
      $("save-status").textContent = "暫存失敗";
    }
  }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function currentTask() {
    return library[currentIndex] || null;
  }

  function renderList() {
    const q = $("search").value.trim();
    const filter = $("filter").value;
    const box = $("taskList");
    box.innerHTML = "";
    let done = 0;
    library.forEach((task, idx) => {
      if (isDone(task)) done += 1;
      const st = statusOf(task);
      if (filter === "open" && st === "done") return;
      if (filter === "done" && st !== "done") return;
      if (filter === "noted") {
        const r = getReview(task.taskId);
        const uns = r.unsuitableNotes || {};
        const hasUnsuitable = Object.values(uns).some((v) => String(v || "").trim());
        if (!r.itemNotes.length && !String(r.overallComment || "").trim() && !hasUnsuitable) return;
      }
      if (q && !task.taskName.includes(q) && !String(idx + 1).includes(q)) return;
      const btn = document.createElement("button");
      btn.className = "task" + (idx === currentIndex ? " active" : "");
      btn.type = "button";
      btn.innerHTML = `<span class="dot ${st}"></span><span>${escapeHtml(task.taskName)}${overlapIds.has(task.taskId) ? '<span class="n"> · 重疊</span>' : ""}<span class="n">${getReview(task.taskId).itemNotes.length} 則問題</span></span><span class="n">${idx + 1}</span>`;
      btn.addEventListener("click", () => {
        currentIndex = idx;
        citedOpen = false;
        renderAll();
        persist();
      });
      box.appendChild(btn);
    });
    $("progress-line").innerHTML = `已完成 <b>${done}</b> / ${library.length}（核心至少 2 類即算完成，沒有上限；沒問題可不標）`;
  }

  function renderPane() {
    const task = currentTask();
    const pane = $("pane");
    if (!task) {
      pane.innerHTML = `<p class="desc">找不到作業。</p>`;
      return;
    }
    const review = getReview(task.taskId);
    const cited = task.citedIn || [];
    const shown = citedOpen ? cited : cited.slice(0, 4);
    const citedHtml = shown.map((c) => `<span class="chip">${escapeHtml(c.Industry || "")}／${escapeHtml(c.category || "")}</span>`).join("");
    const more = cited.length > 4
      ? `<button type="button" class="chip more" id="cited-more">${citedOpen ? "收合" : "顯示全部 " + cited.length + " 筆"}</button>`
      : "";
    let groups = "";
    (task.hazardGroups || []).forEach((g, gIdx) => {
      const coreOn = review.coreSet.includes(g.groupName);
      const libCore = !!g["核心重點_existing"];
      const typeFlag = !!findNote(review, { groupName: g.groupName, field: "severitylevel", index: null });
      const src = (g.sourceSeverities || []).filter(Boolean);
      const srcHtml = src.length
        ? `<span class="s-pills">各情境原始 ${src.map((s) => `<b>${escapeHtml(s)}</b>`).join(" · ")}</span>`
        : "";
      const uns = review.unsuitableNotes[g.groupName] || "";
      groups += `<article class="card${coreOn ? " core" : ""}" id="g-${gIdx}">
        <div class="card-h">
          <span>${escapeHtml(g.groupName)}</span>
          <span>
            ${libCore ? '<span class="badge core">庫內核心</span>' : ""}
            <button type="button" class="badge s${typeFlag ? " flagged" : ""}" data-g="${gIdx}" data-field="severitylevel" data-i="" title="點此標註類型 S 不適當">類型 ${escapeHtml(g.severitylevel || "—")}</button>
          </span>
        </div>
        <div class="card-b">
          ${srcHtml ? `<div class="s-pills" style="margin-bottom:8px">${srcHtml}（類型 S 為最高值，不是加總）</div>` : ""}
          <div class="list-title">核心理由（點一下可標問題）</div>
          ${renderReason(task, g, gIdx)}
          <div class="list-title">危害情境與對上的措施</div>
          ${renderScenarios(task, g, gIdx)}
          ${renderUnlinked(task, g, gIdx)}
          <div class="unsuitable-box">
            <div class="list-title">不適當之處（選填）</div>
            <textarea data-unsuitable="${gIdx}" placeholder="S 評分、情境或對策有哪裡不適當，寫在這裡。沒有可不填。">${escapeHtml(uns)}</textarea>
          </div>
          <div class="missing-row">
            <button type="button" class="ghost" data-miss="1" data-g="${gIdx}" data-field="hazardItems">整組缺危害情境</button>
            <button type="button" class="ghost" data-miss="1" data-g="${gIdx}" data-field="AvoidItems">整組缺改善項目</button>
          </div>
        </div>
      </article>`;
    });
    pane.innerHTML = `
      <h2>${escapeHtml(task.taskName)}</h2>
      <p class="desc">${escapeHtml(task.taskdescribe || "")}</p>
      <p class="hint">每一則情境下面是它掛上的措施。點改善項目可標記問題，也可直接指定為必要設施，只作用在這一則。必要設施可勾「刪掉」或按「修訂」改寫。</p>
      <div class="list-title">引用背景（只供判斷泛用或製程綁定，不要據此建議拿掉模板）</div>
      <div class="chips">${citedHtml || '<span class="chip">未掛在草案模板</span>'}${more}</div>
      ${groups}`;
    const moreBtn = $("cited-more");
    if (moreBtn) moreBtn.addEventListener("click", () => { citedOpen = !citedOpen; renderPane(); });
    pane.querySelectorAll("[data-field]").forEach((el) => {
      el.addEventListener("click", () => openNoteFromEl(el));
    });
    pane.querySelectorAll("[data-revise]").forEach((el) => {
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        openRevise(task, el);
      });
    });
    pane.querySelectorAll("[data-drop]").forEach((el) => {
      el.addEventListener("click", (ev) => ev.stopPropagation());
      el.addEventListener("change", () => {
        const on = el.checked;
        toggleDrop(
          task.taskId,
          el.getAttribute("data-group"),
          el.getAttribute("data-hazard"),
          el.getAttribute("data-control"),
          on
        );
        const row = el.closest("li");
        if (row) row.classList.toggle("dropped", on);
        renderList();
      });
    });
    pane.querySelectorAll("[data-unsuitable]").forEach((el) => {
      el.addEventListener("input", () => {
        const g = task.hazardGroups[Number(el.getAttribute("data-unsuitable"))];
        getReview(task.taskId).unsuitableNotes[g.groupName] = el.value;
        persist();
        renderList();
      });
    });
  }

  function renderReason(task, group, gIdx) {
    const review = getReview(task.taskId);
    const flagged = !!findNote(review, { groupName: group.groupName, field: "核心理由", index: 0 });
    return `<div class="reason-block${flagged ? " flagged" : ""}" data-g="${gIdx}" data-field="核心理由" data-i="0">${escapeHtml(group["核心理由"] || "（無）")}</div>`;
  }

  const LANE_RE = /[（(【]\s*(消除|取代|工程改善|工程控制|行政管理|管理控制|個人防護具|個人防護)\s*[）)】]\s*$/;

  function laneOf(text) {
    const m = String(text || "").match(LANE_RE);
    return m ? m[1] : "";
  }

  function laneClass(tag) {
    if (tag === "工程改善" || tag === "消除" || tag === "取代" || tag === "工程控制") return "eng";
    if (tag === "個人防護" || tag === "個人防護具") return "ppe";
    return "";
  }

  function dropKey(groupName, hazardItem, controlText) {
    return [groupName, hazardItem, controlText].join("\u001f");
  }

  function originalControlText(groupName, hazardItem, text) {
    const task = currentTask();
    if (!task) return "";
    const row = mapRowsFor(task, { groupName }).find((item) => item.hazardItem === hazardItem);
    const control = row && (row.controls || []).find((item) => item.text === text);
    return control ? String(control.originalText || "") : "";
  }

  function isDropped(review, groupName, hazardItem, controlText) {
    const keys = review.droppedLinks || [];
    const original = originalControlText(groupName, hazardItem, controlText);
    return keys.includes(dropKey(groupName, hazardItem, controlText))
      || (!!original && keys.includes(dropKey(groupName, hazardItem, original)));
  }

  function coreRevisionOf(review, groupName, hazardItem, from) {
    const original = originalControlText(groupName, hazardItem, from);
    const items = review.coreRevisions || [];
    const matches = (item, text) => item.groupName === groupName && item.hazardItem === hazardItem && item.from === text;
    const hit = items.find((item) => matches(item, from)) || (original && items.find((item) => matches(item, original)));
    return hit ? String(hit.to || "") : "";
  }

  function setCoreRevision(taskId, groupName, hazardItem, from, to) {
    const r = getReview(taskId);
    const next = (r.coreRevisions || []).filter((item) =>
      !(item.groupName === groupName && item.hazardItem === hazardItem && (item.from === from || item.from === originalControlText(groupName, hazardItem, from)))
    );
    const clean = String(to || "").trim();
    if (clean && clean !== from) next.push({ groupName, hazardItem, from, to: clean });
    r.coreRevisions = next;
    persist();
  }

  function toggleDrop(taskId, groupName, hazardItem, controlText, on) {
    const r = getReview(taskId);
    const key = dropKey(groupName, hazardItem, controlText);
    const set = new Set(r.droppedLinks);
    const original = originalControlText(groupName, hazardItem, controlText);
    const originalKey = original ? dropKey(groupName, hazardItem, original) : "";
    if (originalKey && set.has(originalKey)) {
      const row = mapRowsFor(currentTask(), { groupName }).find((item) => item.hazardItem === hazardItem);
      (row && row.controls || []).filter((item) => item.originalText === original).forEach((item) => {
        set.add(dropKey(groupName, hazardItem, item.text));
      });
      set.delete(originalKey);
    }
    if (on) set.add(key);
    else set.delete(key);
    r.droppedLinks = [...set];
    persist();
  }

  function necessaryMarkOf(review, groupName, hazardItem, controlText) {
    return (review.necessaryMarks || []).find((item) =>
      item.groupName === groupName && item.hazardItem === hazardItem && item.control === controlText
    ) || null;
  }

  function isNecessaryControl(review, groupName, hazardItem, controlText, mapCore) {
    const mark = necessaryMarkOf(review, groupName, hazardItem, controlText);
    return mark ? mark.on : !!mapCore;
  }

  function setNecessaryMark(taskId, groupName, hazardItem, controlText, on, mapCore) {
    const r = getReview(taskId);
    const next = (r.necessaryMarks || []).filter((item) =>
      !(item.groupName === groupName && item.hazardItem === hazardItem && item.control === controlText)
    );
    if (!!on !== !!mapCore) next.push({ groupName, hazardItem, control: controlText, on: !!on });
    r.necessaryMarks = next;
    persist();
  }

  function mapRowsFor(task, group) {
    const byTask = scenarioLinks[task.taskName] || {};
    return byTask[group.groupName] || [];
  }

  function avoidTextById(tasks, taskName, groupName, controlId) {
    const task = (tasks || []).find((item) => item.taskName === taskName);
    const group = task && (task.hazardGroups || []).find((item) => item.groupName === groupName);
    const avoids = (group && group.AvoidItems) || [];
    const match = /^A(\d+)$/.exec(String(controlId || "").trim());
    if (!match) return "";
    const idx = Number(match[1]) - 1;
    if (idx < 0 || idx >= avoids.length) return "";
    return String(avoids[idx] || "").trim();
  }

  function indexScenarioMaps(doc, tasks) {
    const byTask = {};
    const unlinked = {};
    (doc.maps || []).forEach((map) => {
      const taskName = map.taskName || "";
      const groupName = map.groupName || "";
      if (!taskName || !groupName) return;
      const rows = (map.hazardControlMap || []).map((row) => {
        const cores = new Set((row.coreControlRefs || []).map((id) => String(id || "").trim()).filter(Boolean));
        const controls = (row.controlRefs || []).map((ref) => {
          if (!ref) return null;
          const cid = typeof ref === "string" ? String(ref).trim() : String(ref.controlId || "").trim();
          const inline = ref && typeof ref === "object" ? String(ref.text || "").trim() : "";
          const text = inline || avoidTextById(tasks, taskName, groupName, cid);
          if (!text) return null;
          return { text, originalText: String((ref && ref.originalText) || ""), core: (ref && ref.role === "core") || cores.has(cid) };
        }).filter(Boolean);
        return {
          hazardItem: String(row.hazardItem || "").trim(),
          severity: row.severity,
          controls
        };
      }).filter((row) => row.hazardItem);
      (byTask[taskName] || (byTask[taskName] = {}))[groupName] = rows;
      const loose = (map.unlinkedControls || []).map((item) => ({
        text: String((item && item.text) || "").trim(),
        reason: String((item && item.reason) || "").trim()
      })).filter((item) => item.text);
      if (loose.length) (unlinked[taskName] || (unlinked[taskName] = {}))[groupName] = loose;
    });
    return { byTask, unlinked };
  }

  function normalizeControl(item) {
    if (item && typeof item === "object") {
      return { text: String(item.text || ""), originalText: String(item.originalText || ""), core: !!item.core };
    }
    return { text: String(item || ""), core: false };
  }

  function scenarioBlocks(task, group) {
    const mapped = mapRowsFor(task, group);
    const used = new Set();
    const libItems = group.hazardItems || [];
    const controlsOf = (row) => (row && row.controls ? row.controls : []).map(normalizeControl).filter((c) => c.text);
    const blocks = libItems.map((text, i) => {
      const hit = mapped.find((row) => row.hazardItem === text);
      if (hit) used.add(hit);
      return {
        text,
        index: i,
        severity: (group.hazardSeverities || [])[i] || "",
        controls: controlsOf(hit),
        linked: !!hit
      };
    });
    let extra = 0;
    mapped.forEach((row) => {
      if (used.has(row)) return;
      extra += 1;
      const sev = Number(row.severity);
      blocks.push({
        text: row.hazardItem || "",
        index: -extra,
        severity: sev >= 1 && sev <= 5 ? "S" + sev : "",
        controls: controlsOf(row),
        linked: true
      });
    });
    return blocks;
  }

  function renderScenarios(task, group, gIdx) {
    const review = getReview(task.taskId);
    const blocks = scenarioBlocks(task, group);
    if (!blocks.length) return `<p class="empty">無</p>`;
    const lis = blocks.map((block) => {
      const inLibrary = block.index !== null && block.index >= 0;
      const flagged = inLibrary && !!findNote(review, { groupName: group.groupName, field: "hazardItems", index: block.index });
      const sevFlag = inLibrary && !!findNote(review, { groupName: group.groupName, field: "severitylevel", index: block.index });
      const sBtn = inLibrary && block.severity
        ? `<button type="button" class="s-pill${sevFlag ? " flagged" : ""}" data-g="${gIdx}" data-field="severitylevel" data-i="${block.index}" title="點此標註這條 S 不適當">${escapeHtml(block.severity)}</button>`
        : `<span class="s-pill miss">${escapeHtml(block.severity || "—")}</span>`;
      const controls = (block.controls || []).map((ctrl) => {
        const text = ctrl.text;
        const dropped = isDropped(review, group.groupName, block.text, text);
        const necessary = isNecessaryControl(review, group.groupName, block.text, text, ctrl.core);
        const revised = necessary ? coreRevisionOf(review, group.groupName, block.text, text) : "";
        const shown = revised || text;
        const tag = laneOf(shown) || laneOf(text);
        const avoidIdx = (group.AvoidItems || []).indexOf(text);
        const mark = necessary ? '<span class="badge core">必要設施</span>' : "";
        const fromNote = revised ? `<span class="revised-from">原文：${escapeHtml(text)}</span>` : "";
        const reviseBtn = necessary
          ? `<button type="button" class="revise-btn" data-revise="1" data-group="${escapeHtml(group.groupName)}" data-hazard="${escapeHtml(block.text)}" data-from="${escapeHtml(text)}">修訂</button>`
          : "<span></span>";
        return `<li class="${dropped ? "dropped" : ""}">
          <label class="drop-check"><input type="checkbox" data-drop="1" data-group="${escapeHtml(group.groupName)}" data-hazard="${escapeHtml(block.text)}" data-control="${escapeHtml(text)}" ${dropped ? "checked" : ""}>刪掉</label>
          <span class="core-slot">${mark}</span>
          <span class="lane ${laneClass(tag)}">${escapeHtml(tag || "措施")}</span>
          <span class="line-text" data-g="${gIdx}" data-field="AvoidItems" data-i="${avoidIdx >= 0 ? avoidIdx : ""}" data-hazard="${escapeHtml(block.text)}" data-control="${escapeHtml(text)}" data-map-core="${ctrl.core ? "1" : "0"}" data-quote="${escapeHtml(shown)}">${escapeHtml(shown)}${fromNote}</span>
          ${reviseBtn}
        </li>`;
      }).join("");
      const body = controls
        ? `<ul class="linked">${controls}</ul>`
        : `<p class="no-link">這則沒有對上的措施</p>`;
      return `<li class="scenario${flagged ? " flagged" : ""}">
        <div class="line-row">${sBtn}<span class="line-text" data-g="${gIdx}" data-field="hazardItems" data-i="${block.index}" data-quote="${escapeHtml(block.text)}">${escapeHtml(block.text)}</span></div>
        ${body}
      </li>`;
    }).join("");
    return `<ol class="lines">${lis}</ol>`;
  }

  function renderUnlinked(task, group, gIdx) {
    const linked = new Set();
    scenarioBlocks(task, group).forEach((block) => {
      (block.controls || []).forEach((ctrl) => linked.add(ctrl.text));
    });
    const noted = ((unlinkedLinks[task.taskName] || {})[group.groupName] || []);
    const reasonOf = {};
    noted.forEach((item) => { reasonOf[item.text] = item.reason || ""; });
    const rest = (group.AvoidItems || []).filter((text) => !linked.has(text));
    noted.forEach((item) => {
      if (!linked.has(item.text) && rest.indexOf(item.text) < 0) rest.push(item.text);
    });
    if (!rest.length) return "";
    const review = getReview(task.taskId);
    const lis = rest.map((text) => {
      const idx = (group.AvoidItems || []).indexOf(text);
      const flagged = !!findNote(review, { groupName: group.groupName, field: "AvoidItems", index: idx });
      const reason = reasonOf[text] ? `<div class="unlink-reason">${escapeHtml(reasonOf[text])}</div>` : "";
      return `<li class="${flagged ? "flagged" : ""}"><div class="line-row"><span class="line-text" data-g="${gIdx}" data-field="AvoidItems" data-i="${idx >= 0 ? idx : ""}">${escapeHtml(text)}</span></div>${reason}</li>`;
    }).join("");
    return `<div class="list-title">未掛上的改善項目</div><ol class="lines">${lis}</ol>`;
  }

  function renderLines(task, group, gIdx, field) {
    const review = getReview(task.taskId);
    const items = group[field] || [];
    if (!items.length) return `<p class="empty">無</p>`;
    const scores = field === "hazardItems" ? (group.hazardSeverities || []) : [];
    const lis = items.map((text, i) => {
      const flagged = !!findNote(review, { groupName: group.groupName, field, index: i });
      const sevFlag = field === "hazardItems" && !!findNote(review, { groupName: group.groupName, field: "severitylevel", index: i });
      const score = scores[i] || "";
      const sBtn = field === "hazardItems"
        ? (score
          ? `<button type="button" class="s-pill${sevFlag ? " flagged" : ""}" data-g="${gIdx}" data-field="severitylevel" data-i="${i}" title="點此標註這條 S 不適當">${escapeHtml(score)}</button>`
          : `<span class="s-pill miss" title="尚無分數">—</span>`)
        : "";
      return `<li class="${flagged ? "flagged" : ""}"><div class="line-row">${sBtn}<span class="line-text" data-g="${gIdx}" data-field="${field}" data-i="${i}">${escapeHtml(text)}</span></div></li>`;
    }).join("");
    return `<ol class="lines">${lis}</ol>`;
  }

  function renderReview() {
    const task = currentTask();
    const box = $("review");
    if (!task) { box.innerHTML = ""; return; }
    const review = getReview(task.taskId);
    const errs = reviewErrors(task, review);
    const coreBoxes = (task.hazardGroups || []).map((g) => {
      const checked = review.coreSet.includes(g.groupName) ? "checked" : "";
      const lib = g["核心重點_existing"] ? '<span class="lib">庫內有勾，請自行判斷</span>' : "";
      return `<label class="core-item"><input type="checkbox" data-core="${escapeHtml(g.groupName)}" ${checked}> <span>${escapeHtml(g.groupName)}</span>${lib}</label>`;
    }).join("");
    const notes = (review.itemNotes || []).map((n, i) => {
      const loc = n.index === null ? "整組缺條" : `#${n.index}`;
      const fieldLabel = fieldLabelOf(n.field);
      const tags = (n.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      return `<article class="note" data-edit="${i}">
        <div><b>${escapeHtml(n.groupName)}</b> · ${fieldLabel} ${loc}</div>
        <div class="tags">${tags}</div>
        ${n.quote ? `<div class="q">${escapeHtml(n.quote)}</div>` : ""}
        <div>${escapeHtml(n.problem)}</div>
      </article>`;
    }).join("");
    box.innerHTML = `
      <div class="rev-h">五分鐘優先檢視（至少 2 類，沒有上限）</div>
      <p class="hint${errs.length ? " bad" : " ok"}">${errs.length ? errs.join("；") + " · " : ""}已勾 ${review.coreSet.length} 類</p>
      <div class="core-list">${coreBoxes}</div>
      <div class="rev-h">綜合意見（選填，不限格式）</div>
      <p class="hint">不受標籤、條數或核心勾選限制。可寫整體好壞、缺什麼、現場能不能用。</p>
      <textarea id="overall-comment" placeholder="自由書寫即可，不必套左側的逐條標註規則。">${escapeHtml(review.overallComment || "")}</textarea>
      <div class="rev-h">已標問題（${review.itemNotes.length}）</div>
      <p class="hint">點左側句子、S 分數或核心理由即可新增。每組「不適當之處」會一併匯出。沒問題可不標。</p>
      ${notes || '<p class="empty">尚未標任何句子。若只想寫整體看法，用上面的綜合意見或各組不適當欄即可。</p>'}`;
    const overall = $("overall-comment");
    if (overall) {
      overall.addEventListener("input", () => {
        getReview(task.taskId).overallComment = overall.value;
        persist();
        renderList();
      });
    }
    box.querySelectorAll("input[data-core]").forEach((input) => {
      input.addEventListener("change", () => {
        toggleCore(task.taskId, input.getAttribute("data-core"), input.checked);
        renderAll();
      });
    });
    box.querySelectorAll("[data-edit]").forEach((el) => {
      el.addEventListener("click", () => {
        const note = review.itemNotes[Number(el.getAttribute("data-edit"))];
        openNoteEditor(task, note, true);
      });
    });
  }

  function renderAll() {
    renderList();
    renderPane();
    renderReview();
    $("btn-prev").disabled = currentIndex <= 0;
    $("btn-next").disabled = currentIndex >= library.length - 1;
  }

  function fieldLabelOf(field) {
    if (field === "hazardItems") return "危害情境";
    if (field === "AvoidItems") return "改善項目";
    if (field === "severitylevel") return "嚴重性S";
    return "核心理由";
  }

  function quoteFrom(task, gIdx, field, index) {
    const g = task.hazardGroups[gIdx];
    if (field === "severitylevel") {
      if (index === null) return "類型 " + (g.severitylevel || "");
      const s = (g.hazardSeverities || [])[index] || "—";
      const text = (g.hazardItems || [])[index] || "";
      return s + (text ? "｜" + text : "");
    }
    if (index === null) return "";
    if (field === "核心理由") return g["核心理由"] || "";
    return (g[field] || [])[index] || "";
  }

  function openNoteFromEl(el) {
    const task = currentTask();
    const gIdx = Number(el.getAttribute("data-g"));
    const field = el.getAttribute("data-field");
    const miss = el.getAttribute("data-miss") === "1";
    const index = miss ? null : (el.getAttribute("data-i") === "" ? null : Number(el.getAttribute("data-i")));
    const group = task.hazardGroups[gIdx];
    const partial = {
      groupName: group.groupName,
      field,
      index,
      quote: el.hasAttribute("data-quote") ? el.getAttribute("data-quote") : quoteFrom(task, gIdx, field, index),
      hazardItem: el.getAttribute("data-hazard") || "",
      controlText: el.getAttribute("data-control") || "",
      mapCore: el.getAttribute("data-map-core") === "1"
    };
    const existing = findNote(getReview(task.taskId), partial);
    openNoteEditor(task, {
      ...(existing || partial),
      hazardItem: partial.hazardItem,
      controlText: partial.controlText,
      mapCore: partial.mapCore,
      quote: partial.quote || (existing && existing.quote) || ""
    }, !!existing);
  }

  function openNoteEditor(task, note, isEdit) {
    draftNote = {
      taskId: task.taskId,
      groupName: note.groupName,
      field: note.field,
      index: note.index === undefined ? null : note.index,
      quote: note.quote || "",
      tags: [...(note.tags || [])],
      problem: note.problem || "",
      hazardItem: note.hazardItem || "",
      controlText: note.controlText || "",
      mapCore: !!note.mapCore,
      isEdit
    };
    const canNecessary = draftNote.field === "AvoidItems" && draftNote.hazardItem && draftNote.controlText;
    const necessaryOn = canNecessary && isNecessaryControl(
      getReview(task.taskId),
      draftNote.groupName,
      draftNote.hazardItem,
      draftNote.controlText,
      draftNote.mapCore
    );
    const fieldLabel = fieldLabelOf(note.field);
    const loc = draftNote.index === null
      ? (draftNote.field === "severitylevel" ? "類型 S" : "無法對到既有句子（整組缺條）")
      : `第 ${draftNote.index} 條`;
    $("note-meta").textContent = `${note.groupName} · ${fieldLabel} · ${loc}`;
    $("note-quote").textContent = draftNote.quote || "（無對應原文）";
    $("note-problem").value = draftNote.problem;
    $("note-delete").classList.toggle("hidden", !isEdit);
    const necessaryWrap = $("note-necessary-wrap");
    const necessaryBox = $("note-necessary");
    necessaryWrap.classList.toggle("hidden", !canNecessary);
    necessaryBox.checked = necessaryOn;
    const tagBox = $("note-tags");
    tagBox.innerHTML = "";
    TAG_SET.forEach((t) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `${t}｜${TAG_HELP[t]}`;
      if (draftNote.tags.includes(t)) b.classList.add("on");
      b.addEventListener("click", () => {
        if (draftNote.tags.includes(t)) draftNote.tags = draftNote.tags.filter((x) => x !== t);
        else draftNote.tags.push(t);
        b.classList.toggle("on");
      });
      tagBox.appendChild(b);
    });
    $("note-modal").classList.remove("hidden");
    $("note-modal").setAttribute("aria-hidden", "false");
    $("note-problem").focus();
  }

  function closeModal() {
    $("note-modal").classList.add("hidden");
    $("note-modal").setAttribute("aria-hidden", "true");
    draftNote = null;
  }

  function openRevise(task, el) {
    const groupName = el.getAttribute("data-group") || "";
    const hazardItem = el.getAttribute("data-hazard") || "";
    const from = el.getAttribute("data-from") || "";
    const review = getReview(task.taskId);
    const revised = coreRevisionOf(review, groupName, hazardItem, from);
    draftRevise = { taskId: task.taskId, groupName, hazardItem, from, row: el.closest("li") };
    $("revise-meta").textContent = groupName + " · 只改這一則情境";
    $("revise-original").textContent = from;
    $("revise-text").value = revised || from;
    $("revise-err").textContent = "";
    const dropped = isDropped(review, groupName, hazardItem, from);
    $("revise-drop").textContent = dropped ? "恢復這一則" : "刪掉這一則";
    $("revise-modal").classList.remove("hidden");
    $("revise-modal").setAttribute("aria-hidden", "false");
    $("revise-text").focus();
  }

  function closeRevise() {
    $("revise-modal").classList.add("hidden");
    $("revise-modal").setAttribute("aria-hidden", "true");
    draftRevise = null;
  }

  function paintRevisedRow(row, from, shown, dropped) {
    if (!row) return;
    row.classList.toggle("dropped", dropped);
    const box = row.querySelector("input[data-drop]");
    if (box) box.checked = dropped;
    const dropBtn = $("revise-drop");
    if (dropBtn && draftRevise) dropBtn.textContent = dropped ? "恢復這一則" : "刪掉這一則";
    const span = row.querySelector(".line-text");
    if (span) {
      const note = shown !== from ? `<span class="revised-from">原文：${escapeHtml(from)}</span>` : "";
      span.innerHTML = `${escapeHtml(shown)}${note}`;
      span.setAttribute("data-quote", shown);
    }
    const lane = row.querySelector(".lane");
    if (lane) {
      const tag = laneOf(shown) || laneOf(from);
      lane.textContent = tag || "措施";
      lane.className = "lane " + laneClass(tag);
    }
  }

  function saveRevise() {
    if (!draftRevise) return;
    const text = $("revise-text").value.trim();
    if (!text) {
      $("revise-err").textContent = "請寫修訂後的措施，或按「刪掉這一則」。";
      return;
    }
    setCoreRevision(draftRevise.taskId, draftRevise.groupName, draftRevise.hazardItem, draftRevise.from, text);
    const dropped = isDropped(getReview(draftRevise.taskId), draftRevise.groupName, draftRevise.hazardItem, draftRevise.from);
    paintRevisedRow(draftRevise.row, draftRevise.from, text, dropped);
    closeRevise();
    renderList();
  }

  function toggleReviseDrop() {
    if (!draftRevise) return;
    const review = getReview(draftRevise.taskId);
    const on = !isDropped(review, draftRevise.groupName, draftRevise.hazardItem, draftRevise.from);
    toggleDrop(draftRevise.taskId, draftRevise.groupName, draftRevise.hazardItem, draftRevise.from, on);
    const saved = coreRevisionOf(getReview(draftRevise.taskId), draftRevise.groupName, draftRevise.hazardItem, draftRevise.from);
    paintRevisedRow(draftRevise.row, draftRevise.from, saved || draftRevise.from, on);
    renderList();
  }

  function saveDraftNote() {
    if (!draftNote) return;
    const problem = $("note-problem").value.trim();
    const canNecessary = draftNote.field === "AvoidItems" && draftNote.hazardItem && draftNote.controlText;
    if (canNecessary) {
      setNecessaryMark(
        draftNote.taskId,
        draftNote.groupName,
        draftNote.hazardItem,
        draftNote.controlText,
        $("note-necessary").checked,
        draftNote.mapCore
      );
    }
    if (!draftNote.tags.length && !problem) {
      closeModal();
      renderAll();
      return;
    }
    if (!draftNote.tags.length) { alert("請至少選一個標籤。"); return; }
    if (!problem) { alert("請用句子寫出問題說明。"); return; }
    upsertNote(draftNote.taskId, { ...draftNote, problem });
    closeModal();
    renderAll();
    maybeRemindBackup();
  }

  function exportResult() {
    if (!packCode) return;
    const tasks = {};
    const incomplete = [];
    library.forEach((task) => {
      const review = getReview(task.taskId);
      tasks[task.taskId] = {
        taskId: task.taskId,
        taskName: task.taskName,
        coreSet: [...review.coreSet],
        overallComment: String(review.overallComment || "").trim(),
        unsuitableNotes: { ...(review.unsuitableNotes || {}) },
        droppedLinks: [...(review.droppedLinks || [])],
        coreRevisions: (review.coreRevisions || []).map((item) => ({
          groupName: item.groupName,
          hazardItem: item.hazardItem,
          from: item.from,
          to: item.to
        })),
        necessaryMarks: (review.necessaryMarks || []).map((item) => ({
          groupName: item.groupName,
          hazardItem: item.hazardItem,
          control: item.control,
          on: !!item.on
        })),
        itemNotes: review.itemNotes.map((n) => ({
          groupName: n.groupName,
          field: n.field,
          index: n.index === undefined ? null : n.index,
          quote: n.quote || "",
          tags: [...(n.tags || [])],
          problem: n.problem || ""
        }))
      };
      if (!isDone(task)) incomplete.push(task.taskId);
    });
    const doc = {
      schema: "ra-task-judge-phase1",
      dataVersion: DATA_VER,
      phase: 1,
      annotator: "expert:" + packCode,
      packCode,
      packLabel: packMeta ? packMeta.label : "",
      exportedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
      nTasks: library.length,
      nComplete: library.length - incomplete.length,
      incomplete,
      formatNotes: [
        "coreSet + itemNotes 為逐條標記；overallComment 為綜合意見；unsuitableNotes 為各危害類型的不適當之處；droppedLinks 為某一則情境上被刪掉的措施；coreRevisions 為某一則情境上改寫過的必要設施（from 原文、to 修訂文）；necessaryMarks 為審查時對某一則情境的措施指定或取消必要設施（on 為真表示指定，為假表示取消原本的必要設施）",
        "severitylevel 為類型 S（各情境最高，不是加總）；hazardSeverities 為各情境 S（Map 對得到的沿用原始分，對不到的依表十補評）"
      ],
      tasks
    };
    const day = new Date().toISOString().slice(0, 10);
    downloadJson(`phase1_expert_${packCode}_${day}.json`, doc);
    if (incomplete.length) {
      alert(`已下載。尚有 ${incomplete.length} 筆未完成（核心未滿 2 類，或問題標註缺標籤／說明）。未完成的作業仍寫進檔案，之後可繼續補。`);
    }
  }

  function exportProgress() {
    downloadJson(`phase1_expert_progress_${packCode}_${new Date().toISOString().slice(0, 10)}.json`, {
      schema: "ra-task-judge-phase1-expert-progress",
      dataVersion: DATA_VER,
      annotator,
      packCode,
      lastIndex: currentIndex,
      lastBackupMilestone,
      completeReminded,
      reviews,
      updatedAt: new Date().toISOString()
    });
  }

  function applyProgress(obj) {
    if (!obj || typeof obj !== "object") throw new Error("進度檔不是物件");
    if (obj.reviews && typeof obj.reviews === "object") {
      reviews = obj.reviews;
    } else if (obj.tasks && typeof obj.tasks === "object") {
      reviews = {};
      Object.values(obj.tasks).forEach((t) => {
        if (!t || !t.taskId) return;
        reviews[t.taskId] = {
          coreSet: t.coreSet || [],
          itemNotes: t.itemNotes || [],
          overallComment: typeof t.overallComment === "string" ? t.overallComment : "",
          unsuitableNotes: (t.unsuitableNotes && typeof t.unsuitableNotes === "object") ? t.unsuitableNotes : {},
          droppedLinks: Array.isArray(t.droppedLinks) ? t.droppedLinks : [],
          coreRevisions: Array.isArray(t.coreRevisions) ? t.coreRevisions : []
        };
      });
    } else {
      throw new Error("找不到 reviews 或 tasks");
    }
    if (obj.annotator) {
      annotator = String(obj.annotator).replace(/^expert:/, "");
      $("annotator").value = annotator;
    }
    if (Number.isInteger(obj.lastBackupMilestone)) lastBackupMilestone = obj.lastBackupMilestone;
    if (obj.completeReminded) completeReminded = !!obj.completeReminded;
    if (Number.isInteger(obj.lastIndex) && obj.lastIndex >= 0 && obj.lastIndex < library.length) {
      currentIndex = obj.lastIndex;
    }
  }

  function wire() {
    $("search").addEventListener("input", renderList);
    $("filter").addEventListener("change", renderList);
    $("gate-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      tryEnter($("gate-code").value);
    });
    $("btn-logout").addEventListener("click", () => {
      localStorage.removeItem(CODE_KEY);
      location.reload();
    });
    $("btn-prev").addEventListener("click", () => {
      if (currentIndex > 0) { currentIndex -= 1; citedOpen = false; renderAll(); persist(); }
    });
    $("btn-next").addEventListener("click", () => {
      if (currentIndex < library.length - 1) { currentIndex += 1; citedOpen = false; renderAll(); persist(); }
    });
    $("btn-next-open").addEventListener("click", () => {
      const start = currentIndex;
      for (let i = 1; i <= library.length; i += 1) {
        const idx = (start + i) % library.length;
        if (!isDone(library[idx])) {
          currentIndex = idx;
          citedOpen = false;
          renderAll();
          persist();
          return;
        }
      }
      alert(library.length + " 筆都已完成。");
    });
    $("btn-export").addEventListener("click", exportResult);
    $("btn-progress").addEventListener("click", exportProgress);
    $("progress-input").addEventListener("change", (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyProgress(JSON.parse(reader.result));
          persist();
          renderAll();
          alert("進度已還原。");
        } catch (err) {
          alert("讀取失敗：" + err.message);
        }
      };
      reader.readAsText(file, "UTF-8");
      ev.target.value = "";
    });
    $("admin-import").addEventListener("change", (ev) => {
      const files = [...(ev.target.files || [])];
      if (!files.length) return;
      Promise.all(files.map((file) => file.text().then((txt) => JSON.parse(txt))))
        .then((docs) => {
          docs.forEach((doc) => applyProgress(doc));
          renderAll();
          alert("已匯入 " + files.length + " 份審查結果，可在左側翻閱。");
        })
        .catch((err) => alert("讀取失敗：" + err.message));
      ev.target.value = "";
    });
    $("btn-clear").addEventListener("click", async () => {
      if (!confirm("確定清除本機暫存？未下載的審查會消失。")) return;
      if (progressDb) await progressDb.removeItem("progress");
      reviews = {};
      currentIndex = 0;
      lastBackupMilestone = 0;
      completeReminded = false;
      renderAll();
    });
    $("note-cancel").addEventListener("click", closeModal);
    $("note-save").addEventListener("click", saveDraftNote);
    $("note-delete").addEventListener("click", () => {
      if (!draftNote) return;
      deleteNote(draftNote.taskId, draftNote);
      closeModal();
      renderAll();
    });
    $("note-modal").addEventListener("click", (e) => {
      if (e.target.id === "note-modal") closeModal();
    });
    $("revise-cancel").addEventListener("click", closeRevise);
    $("revise-save").addEventListener("click", saveRevise);
    $("revise-drop").addEventListener("click", toggleReviseDrop);
    $("revise-modal").addEventListener("click", (e) => {
      if (e.target.id === "revise-modal") closeRevise();
    });
    document.addEventListener("keydown", (e) => {
      if (!$("gate").classList.contains("hidden")) return;
      if (e.key === "Escape") {
        if (!$("revise-modal").classList.contains("hidden")) closeRevise();
        else closeModal();
      }
      if ($("note-modal").classList.contains("hidden") === false) return;
      if ($("revise-modal").classList.contains("hidden") === false) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if (e.key === "ArrowLeft") $("btn-prev").click();
      if (e.key === "ArrowRight") $("btn-next").click();
    });
  }

  function tryEnter(raw) {
    const code = normalizeCode(raw);
    const meta = packByCode(code);
    if (!meta) {
      $("gate-err").textContent = "代號不正確。";
      return;
    }
    localStorage.setItem(CODE_KEY, code);
    enterSession(code);
  }

  async function enterSession(code) {
    packCode = code;
    packMeta = packByCode(code);
    annotator = code;
    $("annotator").value = code;
    overlapIds = overlapSetFor(code);
    library = tasksForPack(packMeta, code);
    currentIndex = 0;
    reviews = {};
    lastBackupMilestone = 0;
    completeReminded = false;
    $("pack-chip").textContent = packCode + " · " + (packMeta.label || "");
    $("admin-import-wrap").classList.toggle("hidden", packMeta.role !== "admin");
    progressDb = packMeta.role === "admin" ? null : openDb(code);
    if (progressDb) {
      const saved = await progressDb.getItem("progress");
      if (saved && (saved.reviews || saved.tasks)) applyProgress(saved);
    }
    $("gate").classList.add("hidden");
    renderAll();
  }

  async function boot() {
    wire();
    const [libRes, asgRes, linkRes] = await Promise.all([
      fetch(`data/library.json?v=${DATA_VER}`),
      fetch("data/assignments.json?v=20260915d"),
      fetch(`scenarioMaps.json?v=${DATA_VER}`)
    ]);
    if (!libRes.ok) throw new Error("無法載入 data/library.json");
    if (!asgRes.ok) throw new Error("無法載入 data/assignments.json");
    if (!linkRes.ok) throw new Error("無法載入 scenarioMaps.json");
    const doc = await libRes.json();
    assignments = await asgRes.json();
    allTasks = doc.tasks || [];
    const indexed = indexScenarioMaps(await linkRes.json(), allTasks);
    scenarioLinks = indexed.byTask;
    unlinkedLinks = indexed.unlinked;
    if (Array.isArray(doc.tagSet) && doc.tagSet.length) TAG_SET = doc.tagSet;
    if (!allTasks.length) throw new Error("作業庫是空的");
    const savedCode = normalizeCode(localStorage.getItem(CODE_KEY) || "");
    if (packByCode(savedCode)) {
      await enterSession(savedCode);
    } else {
      $("gate-code").focus();
    }
  }

  boot().catch((err) => {
    $("pane").innerHTML = `<p class="desc">載入失敗：${escapeHtml(err.message)}。請用本機伺服器或 GitHub Pages 開啟，不要直接雙擊 HTML。</p>`;
    $("gate").classList.add("hidden");
  });
</script>
</body>
</html>
